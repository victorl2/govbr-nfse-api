[package]
name = "nfse-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "CLI para o serviço de emissão de NFS-e pelo Sistema Nacional"
license = "Apache-2.0"
repository = "https://github.com/victorl2/govbr-nfse-api"

[[bin]]
name = "nfse"
path = "src/main.rs"

[dependencies]
# ureq over reqwest: blocking, no async runtime, and a fraction of the
# dependency tree — this CLI does one request at a time and has no use for tokio.
ureq = { version = "2.10", default-features = false, features = ["tls", "json", "gzip"] }
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
