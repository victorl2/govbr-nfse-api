name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The dummy cert is generated, never committed: the signing pipeline is
      # exercised end-to-end without any real e-CNPJ being available to CI.
      - name: Generate the dummy certificate
        run: ./scripts/generate-dummy-cert.sh

      # UTC deliberately: every fiscal timestamp must come from BrasiliaTime
      # rather than the host zone, and running the suite outside America/Sao_Paulo
      # is what proves it.
      - name: Run tests
        run: mvn -B test
        env:
          TZ: UTC

      - name: Verify the jar is runnable
        run: |
          mvn -B -DskipTests package
          NFSE_PROFILE=local NFSE_CERT_PATH=certs/dummy.p12 NFSE_PORT=8099 \
            java -jar target/nfse.jar &
          for i in $(seq 1 100); do
            curl -sf http://localhost:8099/health && break
            sleep 0.2
          done
          curl -sf http://localhost:8099/health | grep -q '"status":"UP"'

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The build needs BuildKit for the Maven cache mount. Nothing is pushed;
      # this only proves the three-stage build and the jlink module list still
      # produce a working runtime.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nfse:ci

      # jdk.crypto.ec and jdk.localedata are invisible to jdeps and fail
      # silently when dropped from the jlink module list — the first breaks the
      # mTLS handshake, the second turns "R$ 10.000,00" into "R$ 10,000.00".
      # Assert both are present rather than discovering it in production.
      - name: Assert the fragile jlink modules survived
        run: |
          docker run --rm --entrypoint java nfse:ci --list-modules > modules.txt
          grep -q '^jdk.crypto.ec' modules.txt
          grep -q '^jdk.localedata' modules.txt
          docker run --rm --entrypoint java nfse:ci \
            -Duser.language=pt -Duser.country=BR -version 2>&1 | head -1

      # The AOT cache is what makes startup ~265 ms instead of ~680 ms, and
      # AOTMode=auto means a cache that fails to map degrades silently to a slow
      # start. Assert it is present AND actually mapped, or the regression is
      # invisible.
      #
      # This MUST boot the real container: the cache records the classpath it was
      # trained on (`-jar /app/app.jar` plus the manifest Class-Path), so a bare
      # `java -Xlog:aot=info -version` has no classpath and the cache correctly
      # refuses to map. _JAVA_OPTIONS adds the logging without clobbering the
      # image's own JAVA_TOOL_OPTIONS, which carry the AOT flags themselves.
      - name: Assert the AOT cache is present and maps
        run: |
          docker run --rm --entrypoint sh nfse:ci -c 'test -s /app/app.aot'
          ./scripts/generate-dummy-cert.sh
          docker run -d --name nfse-aot -m 192m \
            -v "$PWD/certs/dummy.p12:/secure/dummy.p12:ro" \
            -e NFSE_PROFILE=local \
            -e NFSE_CERT_PATH=/secure/dummy.p12 \
            -e NFSE_CERT_PASSWORD=changeit \
            -e _JAVA_OPTIONS=-Xlog:aot=info \
            nfse:ci
          for i in $(seq 1 100); do
            docker logs nfse-aot 2>&1 | grep -q 'listening on port' && break
            sleep 0.3
          done
          docker logs nfse-aot > aot.log 2>&1
          grep -q 'Opened AOT cache' aot.log
          ! grep -q 'Unable to map shared spaces' aot.log
          docker rm -f nfse-aot

      - name: Boot the container and check health
        run: |
          ./scripts/generate-dummy-cert.sh
          docker run -d --name nfse-ci -m 192m -p 8080:8080 \
            -v "$PWD/certs/dummy.p12:/secure/dummy.p12:ro" \
            -e NFSE_PROFILE=local \
            -e NFSE_CERT_PATH=/secure/dummy.p12 \
            -e NFSE_CERT_PASSWORD=changeit \
            nfse:ci
          for i in $(seq 1 100); do
            curl -sf http://localhost:8080/health && break
            sleep 0.3
          done
          curl -sf http://localhost:8080/health | grep -q '"status":"UP"'
          # The DANFSe renders correctly only if the pt-BR locale really shipped.
          curl -sf -X POST http://localhost:8080/nfse/danfse \
            -H 'Content-Type: application/xml' \
            --data-binary @src/test/resources/dps/nfse-export-sample.xml \
            -o danfse.pdf
          head -c 4 danfse.pdf | grep -q '%PDF'
          docker logs nfse-ci

  # Publishes multi-arch images to ghcr.io, but only after the tests and the
  # image checks above have passed — a fiscal service should never ship an
  # image whose DANFSe or AOT assertions failed.
  #
  # Both architectures build on NATIVE runners rather than under QEMU: the AOT
  # training stage runs a real JVM, and emulating that is both very slow and a
  # cache trained on an emulated CPU.
  publish:
    name: Publish to ghcr.io (${{ matrix.platform }})
    needs: [test, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the merge job below attaches the human tags to a
      # manifest list covering both architectures.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: Tag the multi-arch manifest
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  # ---------------------------------------------------------------- CLI (Rust)
  cli-test:
    name: CLI — testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo fmt --check
        working-directory: cli
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: cli
      - run: cargo test
        working-directory: cli

  # Each target builds on a NATIVE runner. The Linux builds are static musl, so
  # the binary runs on any distribution — including a scratch container.
  cli-build:
    name: CLI — ${{ matrix.target }}
    needs: [cli-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Install the musl linker
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: cli

      - name: Name the artifact
        shell: bash
        run: |
          src="cli/target/${{ matrix.target }}/release/nfse"
          out="nfse-${{ matrix.target }}"
          if [ -f "${src}.exe" ]; then src="${src}.exe"; out="${out}.exe"; fi
          mkdir -p dist
          cp "$src" "dist/$out"
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      # Proves the binary actually runs on the machine that built it. A CLI that
      # links against something missing fails here rather than in someone's hands.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./dist/${{ env.ARTIFACT }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}
          if-no-files-found: error

  cli-release:
    name: CLI — anexar à release
    needs: [cli-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nfse-*
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
